<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#4d6bfe"/>
  <!-- whale body -->
  <ellipse cx="256" cy="290" rx="150" ry="90" fill="#2b3fd0"/>
  <!-- belly -->
  <ellipse cx="256" cy="330" rx="100" ry="55" fill="#e8f0ff"/>
  <!-- tail -->
  <path d="M100 290 L40 240 L70 300 L40 360 Z" fill="#2b3fd0"/>
